# Builds an installable APK — including the Simplified Chinese UI — without any
# of the upstream signing or Sentry secrets, so it can run in a fork.
#
# Run it from the fork's Actions tab, or push to this branch. The APK is both
# attached to the run as an artifact and published as a release asset, because
# artifacts require a signed-in GitHub account to download.
name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [local-apk-build]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # android/ is gitignored and generated, so these caches have to land
      # before prebuild creates it. Native builds for 4 ABIs are the slow part.
      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle
            android/app/build
            android/app/.cxx
          key: android-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'app.json') }}
          restore-keys: android-build-${{ runner.os }}-

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android

      # A throwaway key. It is only good for installing the APK by hand, and it
      # keeps the author's upload keystore out of the fork.
      - name: Generate a local signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/comfy-portal-upload.keystore \
            -storepass android -keypass android \
            -alias comfy-portal-local \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Comfy Portal Local Build, O=Local, C=US"

      - name: Inject release signing config
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: comfy-portal-local
          ANDROID_KEY_PASSWORD: android
        run: python3 .github/scripts/inject-signing-config.py android/app/build.gradle

      - name: Report which ABIs are being built
        run: grep -E '^reactNativeArchitectures' android/gradle.properties || echo "(gradle default)"

      # The Sentry plugin uploads source maps on every release build and fails
      # without a token (see the note in google-play.yml). A fork has no Sentry
      # project, so turn both upload paths off.
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: comfy-portal-local
          ANDROID_KEY_PASSWORD: android
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: |
          cd android
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ComfyPortal-zh.apk
          ls -lh ../ComfyPortal-zh.apk

      # AGP only signs with v1 when minSdk < 24. Xiaomi's installer still looks
      # for the JAR signature and refuses a v2/v3-only package with "the package
      # contains no certificate", so sign it again with all three schemes and
      # record what apksigner says, before and after.
      - name: Re-sign with v1+v2+v3 and write a signature report
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $BT"
          {
            echo "=== apksigner verify, BEFORE re-signing ==="
            "${BT}apksigner" verify --verbose --print-certs ComfyPortal-zh.apk 2>&1 || true
            echo
            echo "=== META-INF certificate entries, BEFORE ==="
            unzip -l ComfyPortal-zh.apk | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF|MF)$' || echo "  (none - no v1 signature)"
          } | tee before.txt

          "${BT}apksigner" sign \
            --ks android/app/comfy-portal-upload.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias comfy-portal-local \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out ComfyPortal-zh-signed.apk ComfyPortal-zh.apk
          mv ComfyPortal-zh-signed.apk ComfyPortal-zh.apk

          {
            cat before.txt
            echo
            echo "=== apksigner verify, AFTER re-signing ==="
            "${BT}apksigner" verify --verbose --print-certs ComfyPortal-zh.apk 2>&1 || true
            echo
            echo "=== META-INF certificate entries, AFTER ==="
            unzip -l ComfyPortal-zh.apk | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF|MF)$' || echo "  (still none)"
            echo
            echo "=== APK size ==="
            ls -l ComfyPortal-zh.apk | awk '{print $5" bytes"}'
          } > apk-verify.txt
          cat apk-verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ComfyPortal-zh-apk
          path: |
            ComfyPortal-zh.apk
            apk-verify.txt
          retention-days: 30

      # Artifacts need a signed-in GitHub account to download, which is useless
      # from a phone. A release asset does not, so publish it there too.
      - name: Attach the APK to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=zh-apk
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ComfyPortal-zh.apk apk-verify.txt --clobber
          else
            gh release create "$TAG" --title "Comfy Portal - Simplified Chinese build" --notes "Includes the Simplified Chinese UI. Signed with a throwaway key, so uninstall any existing Comfy Portal before installing." ComfyPortal-zh.apk apk-verify.txt
          fi
