# Builds an installable APK — including the Simplified Chinese UI — without any
# of the upstream signing or Sentry secrets, so it can run in a fork.
#
# Only arm64-v8a is built: it is what every recent phone uses, and dropping the
# other three ABIs takes the APK from ~104 MB to ~35 MB, which matters a lot when
# the download link is slow.
name: Build Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [local-apk-build]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android

      # A throwaway key. It is only good for installing the APK by hand, and it
      # keeps the author's upload keystore out of the fork.
      - name: Generate a local signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/comfy-portal-upload.keystore \
            -storepass android -keypass android \
            -alias comfy-portal-local \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Comfy Portal Local Build, O=Local, C=US"

      - name: Inject release signing config
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: comfy-portal-local
          ANDROID_KEY_PASSWORD: android
        run: python3 .github/scripts/inject-signing-config.py android/app/build.gradle

      # The Sentry plugin uploads source maps on every release build and fails
      # without a token (see the note in google-play.yml). A fork has no Sentry
      # project, so turn both upload paths off.
      - name: Build release APK (arm64-v8a only)
        env:
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: comfy-portal-local
          ANDROID_KEY_PASSWORD: android
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          SENTRY_DISABLE_NATIVE_DEBUG_UPLOAD: 'true'
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../ComfyPortal-zh-arm64.apk
          ls -lh ../ComfyPortal-zh-arm64.apk

      # AGP only signs with v1 when minSdk < 24, and Xiaomi's installer still
      # looks for the JAR signature. Sign again with all three schemes, then
      # verify at --min-sdk-version 1 so v1 is checked strictly rather than
      # skipped as "not required by this APK's minSdkVersion".
      - name: Sign with v1+v2+v3 and verify strictly
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls -d "$SDK"/build-tools/*/ | sort -V | tail -1)"
          APKSIGNER="${BT}apksigner"

          "${APKSIGNER}" sign \
            --ks android/app/comfy-portal-upload.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias comfy-portal-local \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out ComfyPortal-zh-arm64-signed.apk ComfyPortal-zh-arm64.apk
          mv ComfyPortal-zh-arm64-signed.apk ComfyPortal-zh-arm64.apk

          {
            echo "APK: ComfyPortal-zh-arm64.apk"
            echo "size: $(stat -c %s ComfyPortal-zh-arm64.apk) bytes"
            echo "sha256: $(sha256sum ComfyPortal-zh-arm64.apk | cut -d' ' -f1)"
            echo
            echo "=== apksigner verify (default, follows the APK's minSdk) ==="
            "${APKSIGNER}" verify --verbose --print-certs ComfyPortal-zh-arm64.apk 2>&1 || true
            echo
            echo "=== apksigner verify --min-sdk-version 1 (forces v1 to be checked) ==="
            "${APKSIGNER}" verify --verbose --print-certs --min-sdk-version 1 ComfyPortal-zh-arm64.apk 2>&1 || true
            echo
            echo "=== META-INF certificate entries ==="
            unzip -l ComfyPortal-zh-arm64.apk | grep -E 'META-INF/.*\.(RSA|DSA|EC|SF|MF)$' || echo "  (none)"
            echo
            echo "=== native ABIs shipped ==="
            unzip -l ComfyPortal-zh-arm64.apk | grep -oE 'lib/[^/]+/' | sort -u
          } > apk-verify.txt
          cat apk-verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ComfyPortal-zh-arm64
          path: |
            ComfyPortal-zh-arm64.apk
            apk-verify.txt
          retention-days: 30

      # Artifacts need a signed-in GitHub account to download, which is useless
      # from a phone. A release asset does not. The old universal APK is removed
      # so there is exactly one file to download and no way to mix them up.
      - name: Publish the APK as the only release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=zh-apk
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Comfy Portal - Simplified Chinese build" --notes "Includes the Simplified Chinese UI. arm64-v8a only, ~35 MB. Signed with a throwaway key, so uninstall any existing Comfy Portal before installing."
          fi
          gh release edit "$TAG" --notes "Includes the Simplified Chinese UI. arm64-v8a only, ~35 MB - re-download the whole file if the install reports a missing certificate. Signed with a throwaway key, so uninstall any existing Comfy Portal before installing."
          for old in ComfyPortal-zh.apk apk-verify.txt; do
            gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" ComfyPortal-zh-arm64.apk apk-verify.txt --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
